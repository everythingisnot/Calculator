<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071d17">
<!--page-->
<title>Token Tycoons</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one phone column. Scoreboard, then a square circuit-board ring of 28 chips
   with the dice in the middle, then the action pad under the thumb. Single committed look. */
:root {
  color-scheme: dark;
  --bg: #071d17;          /* solder-mask green, darkest */
  --board: #0e3b2f;       /* the board itself */
  --board-hi: #145040;
  --trace: #c9973a;       /* gold traces and pads */
  --gold: #f2b84b;
  --silk: #f3ecd8;        /* silkscreen cream: tiles and text */
  --ink: #14211b;         /* print on cream */
  --muted: #9db5a6;
  --line: rgba(243, 236, 216, .16);
  --danger: #ff7a6b;
  --f-display: "Chakra Petch", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  background-image:
    radial-gradient(circle at 1px 1px, rgba(201, 151, 58, .22) 1.2px, transparent 1.6px),
    linear-gradient(180deg, #0a2a21, var(--bg) 60%);
  background-size: 22px 22px, auto;
  color: var(--silk);
  font: 15px/1.45 var(--f-body);
  -webkit-tap-highlight-color: transparent;
  min-height: 100vh;
}
#app {
  max-width: 520px; margin: 0 auto;
  padding-block: 12px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 12px;
}
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; }
p { margin: 0; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.label { font: 600 11px/1 var(--f-display); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* Buttons are gold solder pads. */
.btn {
  appearance: none; border: 0; border-radius: 10px; padding: 14px 16px; min-height: 50px;
  font: 700 16px/1 var(--f-display); letter-spacing: .04em; text-transform: uppercase;
  background: linear-gradient(180deg, #ffd27a, var(--gold) 55%, #cf9631); color: var(--ink);
  box-shadow: 0 3px 0 #8a6218, 0 8px 18px rgba(0, 0, 0, .35);
  flex: 1 1 0; min-width: 0;
}
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #8a6218; }
.btn.ghost { background: transparent; color: var(--silk); box-shadow: inset 0 0 0 1.5px var(--line); }
.btn.danger { background: transparent; color: var(--danger); box-shadow: inset 0 0 0 1.5px rgba(255, 122, 107, .5); }
.btn.small { min-height: 40px; padding: 10px 12px; font-size: 13px; flex: 0 0 auto; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.row { display: flex; gap: 10px; align-items: stretch; flex-wrap: wrap; }

/* ---------- Home ---------- */
.hero { text-align: left; padding-top: 14px; display: grid; gap: 6px; }
.logo { font: 700 clamp(40px, 13vw, 60px)/.9 var(--f-display); letter-spacing: -.01em; text-transform: uppercase; }
.logo span { display: block; color: var(--gold); }
.panel { background: rgba(14, 59, 47, .72); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 12px; }
.field { display: grid; gap: 6px; }
.input {
  width: 100%; background: #06140f; border: 1.5px solid var(--line); border-radius: 10px;
  padding: 12px 12px; min-height: 48px; font-size: 16px; color: var(--silk);
}
.input.code { font: 600 22px/1 var(--f-mono); letter-spacing: .3em; text-transform: uppercase; text-align: center; flex: 1 1 120px; min-width: 0; width: auto; }
.picks { display: flex; gap: 8px; }
.pick {
  flex: 1 1 0; min-width: 0; min-height: 48px; border-radius: 10px; border: 1.5px solid var(--line);
  background: #06140f; font-size: 22px; display: grid; place-items: center; padding: 6px;
}
.pick.txt { font: 600 13px/1.15 var(--f-display); letter-spacing: .03em; }
.pick.txt small { display: block; font: 500 11px var(--f-mono); color: var(--muted); margin-top: 3px; }
.pick[aria-pressed="true"] { border-color: var(--gold); background: rgba(242, 184, 75, .14); }
.note { font-size: 13px; color: var(--muted); }
.err { color: var(--danger); font-size: 14px; }
details.rules summary { cursor: pointer; font: 600 14px var(--f-display); letter-spacing: .06em; text-transform: uppercase; }
details.rules ul { margin: 10px 0 0; padding-left: 18px; display: grid; gap: 6px; font-size: 14px; }
.bigcode { font: 600 clamp(44px, 16vw, 64px)/1 var(--f-mono); letter-spacing: .18em; color: var(--gold); text-align: center; padding: 8px 0; }

/* ---------- Game: top bar + scoreboard ---------- */
.top { display: flex; align-items: center; gap: 10px; }
.top h1 { font-size: 17px; letter-spacing: .06em; text-transform: uppercase; flex: 1 1 auto; min-width: 0; }
.top h1 b { color: var(--gold); font-weight: 700; }
.chip { font: 600 12px/1 var(--f-mono); padding: 7px 9px; border-radius: 999px; border: 1px solid var(--line); display: inline-flex; gap: 6px; align-items: center; background: #06140f; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.dot.on { background: #6fe39a; box-shadow: 0 0 8px #6fe39a; }
.dot.wait { background: var(--gold); animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .3; } }
.players { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.pl { border: 1.5px solid var(--line); border-radius: 12px; padding: 9px 10px; background: rgba(6, 20, 15, .7); display: grid; gap: 6px; min-width: 0; }
.pl.active { border-color: var(--pc); box-shadow: 0 0 0 1px var(--pc), 0 0 18px -4px var(--pc); }
.pl.out { opacity: .45; }
.pl-head { display: flex; align-items: center; gap: 7px; min-width: 0; }
.pl-tok { width: 26px; height: 26px; border-radius: 50%; background: var(--pc); display: grid; place-items: center; font-size: 15px; flex: 0 0 auto; }
.pl-name { font: 600 14px/1.1 var(--f-display); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.pl-cash { font: 600 19px/1 var(--f-mono); }
.pl-cash.neg { color: var(--danger); }
.bar { height: 6px; border-radius: 3px; background: rgba(243, 236, 216, .12); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--pc); border-radius: 3px; transition: width .5s; }
.pl-nw { display: flex; justify-content: space-between; font: 500 11px/1 var(--f-mono); color: var(--muted); }

/* ---------- Board ---------- */
.board-wrap { position: relative; }
.board {
  display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); grid-template-rows: repeat(8, minmax(0, 1fr));
  gap: 3px; aspect-ratio: 1; max-width: 100%; padding: 5px; border-radius: 16px;
  background: var(--board);
  background-image:
    linear-gradient(90deg, rgba(201, 151, 58, .18) 1px, transparent 1px),
    linear-gradient(0deg, rgba(201, 151, 58, .18) 1px, transparent 1px);
  background-size: 12.5% 12.5%;
  border: 2px solid var(--trace);
  box-shadow: 0 14px 40px rgba(0, 0, 0, .5), inset 0 0 0 3px #0a2c23;
}
.tile {
  appearance: none; border: 0; padding: 0; min-width: 0; min-height: 0; overflow: hidden;
  background: var(--silk); color: var(--ink); border-radius: 5px;
  display: grid; grid-template-rows: 18% 1fr 26%; position: relative;
  box-shadow: 0 1px 0 rgba(0, 0, 0, .4);
}
.tile .band { display: flex; gap: 2px; align-items: center; justify-content: center; }
.tile .band i { width: 4px; height: 4px; border-radius: 50%; background: rgba(255, 255, 255, .35); }
.tile .band i.on { background: #fff; box-shadow: 0 0 3px #fff; }
.tile .ico { display: grid; place-items: center; font-size: clamp(13px, 4.6vw, 22px); line-height: 1; }
.tile .pr { font: 600 clamp(7px, 2.3vw, 10px)/1 var(--f-mono); display: grid; place-items: center; letter-spacing: -.02em; }
.tile.sp { background: #17493a; color: var(--silk); box-shadow: inset 0 0 0 1px var(--trace); }
.tile.sp .pr { font-family: var(--f-display); letter-spacing: .04em; color: var(--gold); }
.tile.corner { background: #0a2c23; }
.tile.own { box-shadow: 0 0 0 2px var(--oc), 0 0 10px -1px var(--oc); }
.tile.own .pr { background: var(--oc); color: #10160f; }
.tile.here { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.07); } }
.core {
  grid-area: 2 / 2 / 8 / 8; border-radius: 12px; margin: 4px;
  background: radial-gradient(circle at 50% 35%, var(--board-hi), #0a2c23 75%);
  box-shadow: inset 0 0 0 1.5px rgba(201, 151, 58, .55), inset 0 0 30px rgba(0, 0, 0, .4);
  display: grid; grid-template-rows: auto 1fr auto; justify-items: center; align-items: center;
  padding: 9% 7% 7%; text-align: center; min-width: 0; min-height: 0; overflow: hidden;
}
.turn { font: 700 clamp(15px, 5.2vw, 24px)/1.05 var(--f-display); text-transform: uppercase; letter-spacing: .05em; color: var(--tc, var(--silk)); }
.dice { display: flex; gap: 12px; }
.die {
  width: clamp(44px, 14vw, 64px); aspect-ratio: 1; border-radius: 22%; background: var(--silk);
  box-shadow: 0 4px 0 #b9ad8c, 0 10px 18px rgba(0, 0, 0, .45);
  display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); padding: 14%; gap: 4%;
}
.die i { border-radius: 50%; }
.die i.p { background: var(--ink); }
.die.rolling { animation: shake .12s linear infinite; }
@keyframes shake { 25% { transform: rotate(-9deg) translateY(-3px); } 75% { transform: rotate(9deg) translateY(2px); } }
.feed { font-size: clamp(11px, 3.3vw, 14px); line-height: 1.3; color: var(--silk); max-height: 4.1em; overflow: hidden; }
.feed b { font-weight: 600; }
.tokens { position: absolute; inset: 0; pointer-events: none; }
.tok {
  position: absolute; width: 7.4%; aspect-ratio: 1; border-radius: 50%; background: var(--pc);
  display: grid; place-items: center; font-size: clamp(10px, 3.6vw, 17px); line-height: 1;
  transform: translate(-50%, -50%); transition: left .16s ease-out, top .16s ease-out;
  box-shadow: 0 0 0 2px #06140f, 0 4px 8px rgba(0, 0, 0, .6); z-index: 2;
}
.tok.out { display: none; }

/* ---------- Action pad, stack, log ---------- */
.pad { display: grid; gap: 10px; min-height: 62px; align-content: center; }
.pad .offer { font-size: 14px; }
.pad .offer b { font-family: var(--f-display); font-size: 16px; }
.wait { text-align: center; color: var(--muted); font: 500 15px var(--f-display); letter-spacing: .04em; padding: 16px 0; }
.win { text-align: center; display: grid; gap: 4px; }
.win h2 { font-size: 28px; text-transform: uppercase; color: var(--gold); }
.sect { display: grid; gap: 8px; }
.stack { display: grid; gap: 6px; }
.stack button {
  appearance: none; border: 1px solid var(--line); border-left: 5px solid var(--gc); border-radius: 8px; background: rgba(6, 20, 15, .7);
  padding: 9px 10px; display: flex; align-items: center; gap: 8px; text-align: left; min-height: 44px; min-width: 0;
}
.stack .nm { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.stack .ver { font: 600 11px var(--f-mono); color: var(--muted); }
.stack .rent { font: 600 13px var(--f-mono); color: var(--gold); }
.log { font-size: 13px; color: var(--muted); display: grid; gap: 4px; }
.log b { color: var(--silk); font-weight: 600; }

/* ---------- Sheets ---------- */
.scrim { position: fixed; inset: 0; background: rgba(2, 10, 7, .7); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  width: 100%; max-width: 520px; max-height: 86vh; overflow: auto; background: #0c3329; border-top: 2px solid var(--trace);
  border-radius: 18px 18px 0 0; display: grid; gap: 12px;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  animation: up .18s ease-out;
}
@keyframes up { from { transform: translateY(30px); } }
.sheet-head { display: flex; gap: 12px; align-items: center; }
.sheet-ico { width: 52px; height: 52px; border-radius: 10px; background: var(--silk); display: grid; place-items: center; font-size: 28px; border-top: 8px solid var(--gc, var(--trace)); flex: 0 0 auto; }
.sheet h2 { font-size: 22px; }
.rents { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.rents div { border: 1px solid var(--line); border-radius: 8px; padding: 8px 4px; text-align: center; display: grid; gap: 4px; }
.rents div.cur { border-color: var(--gold); background: rgba(242, 184, 75, .12); }
.rents span { font: 600 10px var(--f-display); letter-spacing: .1em; color: var(--muted); }
.rents b { font: 600 14px var(--f-mono); }
.kv { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; border-bottom: 1px dashed var(--line); padding-bottom: 6px; }
.kv b { font-family: var(--f-mono); font-weight: 600; text-align: right; }
@media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }
</style>
<!--/page-->
</head>
<body>
<div id="app"></div>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
