<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071d17">
<!--page-->
<title>Token Tycoons</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one phone column, like sitting across a card table. Rival's side on top,
   the deck and play counter in the middle, your side below, your hand under your thumb.
   Single committed look: a green circuit board with gold traces and cream cards. */
:root {
  color-scheme: dark;
  --bg: #071d17;          /* solder-mask green, darkest */
  --board: #0e3b2f;
  --trace: #c9973a;       /* gold traces and pads */
  --gold: #f2b84b;
  --silk: #f3ecd8;        /* silkscreen cream: cards and text */
  --ink: #14211b;         /* print on cream */
  --muted: #9db5a6;
  --line: rgba(243, 236, 216, .16);
  --danger: #ff7a6b;
  --f-display: "Chakra Petch", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  background-image:
    radial-gradient(circle at 1px 1px, rgba(201, 151, 58, .22) 1.2px, transparent 1.6px),
    linear-gradient(180deg, #0a2a21, var(--bg) 60%);
  background-size: 22px 22px, auto;
  color: var(--silk);
  font: 15px/1.45 var(--f-body);
  -webkit-tap-highlight-color: transparent;
  min-height: 100vh;
}
#app {
  max-width: 520px; margin: 0 auto;
  padding-block: 12px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 12px;
}
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; }
p { margin: 0; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.label { font: 600 11px/1.2 var(--f-display); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* Buttons are gold solder pads. */
.btn {
  appearance: none; border: 0; border-radius: 10px; padding: 14px 16px; min-height: 50px;
  font: 700 15px/1.1 var(--f-display); letter-spacing: .04em; text-transform: uppercase;
  background: linear-gradient(180deg, #ffd27a, var(--gold) 55%, #cf9631); color: var(--ink);
  box-shadow: 0 3px 0 #8a6218, 0 8px 18px rgba(0, 0, 0, .35);
  flex: 1 1 0; min-width: 0;
}
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #8a6218; }
.btn.ghost { background: transparent; color: var(--silk); box-shadow: inset 0 0 0 1.5px var(--line); }
.btn.danger { background: transparent; color: var(--danger); box-shadow: inset 0 0 0 1.5px rgba(255, 122, 107, .5); }
.btn.small { min-height: 40px; padding: 10px 12px; font-size: 13px; flex: 0 0 auto; }
.btn.wide { flex: 1 1 100%; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--gold); background: rgba(242, 184, 75, .16); }
.row { display: flex; gap: 10px; align-items: stretch; flex-wrap: wrap; }

/* ---------- Home ---------- */
.hero { padding-top: 14px; display: grid; gap: 6px; }
.logo { font: 700 clamp(40px, 13vw, 60px)/.9 var(--f-display); letter-spacing: -.01em; text-transform: uppercase; }
.logo span { display: block; color: var(--gold); }
.panel { background: rgba(14, 59, 47, .72); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 12px; }
.field { display: grid; gap: 6px; }
.input {
  width: 100%; background: #06140f; border: 1.5px solid var(--line); border-radius: 10px;
  padding: 12px; min-height: 48px; font-size: 16px; color: var(--silk);
}
.input.code { font: 600 22px/1 var(--f-mono); letter-spacing: .3em; text-transform: uppercase; text-align: center; flex: 1 1 120px; min-width: 0; width: auto; }
.picks { display: flex; gap: 8px; }
.pick { flex: 1 1 0; min-width: 0; min-height: 48px; border-radius: 10px; border: 1.5px solid var(--line); background: #06140f; font-size: 22px; display: grid; place-items: center; padding: 6px; }
.pick[aria-pressed="true"] { border-color: var(--gold); background: rgba(242, 184, 75, .14); }
.note { font-size: 13px; color: var(--muted); }
.err { color: var(--danger); font-size: 14px; }
details.rules summary { cursor: pointer; font: 600 14px var(--f-display); letter-spacing: .06em; text-transform: uppercase; }
details.rules ul { margin: 10px 0 0; padding-left: 18px; display: grid; gap: 6px; font-size: 14px; }
.bigcode { font: 600 clamp(44px, 16vw, 64px)/1 var(--f-mono); letter-spacing: .18em; color: var(--gold); text-align: center; padding: 8px 0; }

/* ---------- Game: top bar ---------- */
.top { display: flex; align-items: center; gap: 10px; }
.top h1 { font-size: 17px; letter-spacing: .06em; text-transform: uppercase; flex: 1 1 auto; min-width: 0; }
.top h1 b { color: var(--gold); font-weight: 700; }
.chip { font: 600 12px/1 var(--f-mono); padding: 7px 9px; border-radius: 999px; border: 1px solid var(--line); display: inline-flex; gap: 6px; align-items: center; background: #06140f; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
.dot.on { background: #6fe39a; box-shadow: 0 0 8px #6fe39a; }
.dot.wait { background: var(--gold); animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .3; } }

/* ---------- A player's side of the table ---------- */
.side { border: 1.5px solid var(--line); border-radius: 14px; padding: 10px; background: rgba(6, 20, 15, .6); display: grid; gap: 8px; }
.side.active { border-color: var(--pc); box-shadow: 0 0 0 1px var(--pc), 0 0 20px -6px var(--pc); }
.side-head { display: flex; align-items: center; gap: 8px; min-width: 0; }
.tokn { width: 28px; height: 28px; border-radius: 50%; background: var(--pc); display: grid; place-items: center; font-size: 16px; flex: 0 0 auto; }
.side-name { font: 600 15px/1.1 var(--f-display); flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stat { appearance: none; border: 1px solid var(--line); background: #06140f; border-radius: 8px; padding: 5px 8px; font: 600 12px/1.1 var(--f-mono); display: grid; gap: 2px; text-align: center; flex: 0 0 auto; }
.stat small { font: 600 9px var(--f-display); letter-spacing: .1em; color: var(--muted); text-transform: uppercase; }
.slots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.slot {
  appearance: none; border: 0; padding: 0; border-radius: 8px; overflow: hidden; min-width: 0; text-align: left;
  background: var(--silk); color: var(--ink); display: grid; grid-template-rows: auto 1fr; min-height: 58px;
}
.slot .sh { background: var(--gc); color: #fff; font: 600 11px/1 var(--f-display); letter-spacing: .04em; padding: 5px 6px; display: flex; justify-content: space-between; gap: 4px; }
.slot .sh b { font-family: var(--f-mono); }
.slot .sc { padding: 4px 6px; font-size: 17px; line-height: 1.15; display: flex; flex-wrap: wrap; gap: 1px 3px; align-items: center; }
.slot .sc em { font: 600 11px var(--f-mono); font-style: normal; margin-left: auto; }
.slot.empty { background: rgba(243, 236, 216, .08); color: var(--muted); }
.slot.empty .sh { background: transparent; color: var(--muted); box-shadow: inset 0 -1px 0 var(--line), inset 3px 0 0 var(--gc); }
.slot.full { box-shadow: 0 0 0 2px var(--gold), 0 0 12px -1px var(--gold); }

/* ---------- Middle of the table ---------- */
.mid { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center; }
.deck {
  width: 46px; aspect-ratio: 5 / 7; border-radius: 6px; background: #17493a; border: 1.5px solid var(--trace);
  box-shadow: 2px 2px 0 #0a2c23, 4px 4px 0 var(--trace); display: grid; place-items: center; font: 600 14px var(--f-mono); color: var(--gold);
}
.feed { font-size: 14px; line-height: 1.3; min-width: 0; }
.feed b { font-weight: 600; }
.feed .turnline { font: 700 16px/1.1 var(--f-display); text-transform: uppercase; letter-spacing: .05em; color: var(--tc); display: block; margin-bottom: 2px; }

/* ---------- Action pad + hand ---------- */
.pad { display: grid; gap: 8px; }
.pad .msg { font-size: 14px; }
.pad .msg b { font-family: var(--f-display); }
.pips { display: inline-flex; gap: 5px; vertical-align: middle; margin-left: 6px; }
.pips i { width: 11px; height: 11px; border-radius: 50%; background: var(--gold); display: block; }
.pips i.used { background: transparent; box-shadow: inset 0 0 0 1.5px var(--muted); }
.wait { text-align: center; color: var(--muted); font: 500 15px var(--f-display); letter-spacing: .04em; padding: 12px 0; }
.win { text-align: center; display: grid; gap: 4px; }
.win h2 { font-size: 28px; text-transform: uppercase; color: var(--gold); }
.hand {
  display: flex; gap: 8px; overflow-x: auto; padding: 4px 16px 12px; margin: 0 -16px;
  scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch;
}
.card {
  appearance: none; border: 0; padding: 0; flex: 0 0 96px; width: 96px; aspect-ratio: 5 / 7; border-radius: 9px; overflow: hidden;
  background: var(--silk); color: var(--ink); position: relative; scroll-snap-align: start;
  display: grid; grid-template-rows: 18px 1fr auto auto; justify-items: center; text-align: center; padding-bottom: 7px;
  box-shadow: 0 4px 10px rgba(0, 0, 0, .45);
}
.card .cb { width: 100%; height: 100%; background: var(--gc, #17493a); }
.card .ci { font-size: 30px; line-height: 1; align-self: center; }
.card .cn { font: 600 12px/1.1 var(--f-display); padding: 0 5px; }
.card .ct { font: 500 9px/1.2 var(--f-display); letter-spacing: .08em; text-transform: uppercase; opacity: .65; padding: 2px 4px 0; }
.card .cv { position: absolute; top: 3px; left: 4px; min-width: 22px; height: 22px; border-radius: 11px; padding: 0 4px; background: var(--ink); color: var(--gold); font: 600 11px/22px var(--f-mono); }
.card.act { background: #124234; color: var(--silk); box-shadow: inset 0 0 0 1.5px var(--trace), 0 4px 10px rgba(0, 0, 0, .45); }
.card.act .cb { background: var(--trace); }
.card.cash { background: linear-gradient(160deg, #ffe2a0, var(--gold)); }
.card.cash .cb { background: #b98322; }
.card.cash .ci { font: 700 30px var(--f-mono); }
.card.big { flex: 0 0 auto; width: 132px; }
.card.big .ci { font-size: 44px; }
.card.big .cn { font-size: 15px; }
.log { font-size: 13px; color: var(--muted); display: grid; gap: 4px; }
.log b { color: var(--silk); font-weight: 600; }

/* ---------- Sheets and covers ---------- */
.scrim { position: fixed; inset: 0; background: rgba(2, 10, 7, .78); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  width: 100%; max-width: 520px; max-height: 88vh; overflow: auto; background: #0c3329; border-top: 2px solid var(--trace);
  border-radius: 18px 18px 0 0; display: grid; gap: 12px;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  animation: up .18s ease-out;
}
@keyframes up { from { transform: translateY(30px); } }
.sheet-head { display: flex; gap: 14px; align-items: center; }
.sheet h2 { font-size: 22px; }
.opts { display: grid; gap: 8px; }
.kv { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; border-bottom: 1px dashed var(--line); padding-bottom: 6px; }
.kv b { font-family: var(--f-mono); font-weight: 600; text-align: right; }
.cover { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: grid; place-items: center; padding: 24px; text-align: center; }
.cover > div { display: grid; gap: 16px; max-width: 320px; }
.cover h2 { font-size: 30px; text-transform: uppercase; }
@media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }
</style>
<!--/page-->
</head>
<body>
<div id="app"></div>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
